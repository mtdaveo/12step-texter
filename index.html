<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12th Step Texter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1f1c;
    --card: #272d24;
    --border: #333830;
    --text: #e8e4dc;
    --muted: #7a8275;
    --accent: #7cb98a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .logo-mark {
    width: 56px; height: 56px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 1.6rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    text-align: center;
    margin-bottom: 8px;
  }

  p {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  a.btn {
    display: block;
    padding: 18px 24px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.2s;
  }

  a.btn-primary {
    background: var(--accent);
    color: #0f1a12;
  }

  a.btn-primary:hover { background: #5a9a6a; }

  a.btn-secondary {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
  }

  a.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-title {
    font-size: 1rem;
    font-weight: 500;
    display: block;
    margin-bottom: 3px;
  }

  .btn-sub {
    font-size: 0.78rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="logo-mark">✦</div>
  <h1>12th Step Texter</h1>
  <p>AA Contact Request System</p>

  <div class="links">
    <a href="sms-facility-form-v2.html" class="btn btn-primary">
      <span class="btn-title">Submit a Request</span>
      <span class="btn-sub">SMS — for facility staff — send an AA contact request</span>
    </a>
    <a href="sms-coordinator-setup-v4.html" class="btn btn-secondary">
      <span class="btn-title">Coordinator Setup</span>
      <span class="btn-sub">SMS — for AA coordinators — configure volunteers and QR code</span>
    </a>
    <a href="facility-form-v17.html" class="btn btn-secondary">
      <span class="btn-title">Submit a Request</span>
      <span class="btn-sub">Legacy (email) — facility staff</span>
    </a>
    <a href="coordinator-setup-v9.html" class="btn btn-secondary">
      <span class="btn-title">Coordinator Setup</span>
      <span class="btn-sub">Legacy (email) — AA coordinators</span>
    </a>
  </div>
</body>
</html>
